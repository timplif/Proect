<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Напоминания о долгах</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .notification-badge {
            background: #ff3b30;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 5px;
        }
        .notification-item {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #0071e3;
        }
        .notification-item.unread {
            border-left-color: #ff9800;
            background: #fffef0;
        }
        .notification-item .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .notification-item .from {
            font-weight: bold;
            color: #0071e3;
        }
        .notification-item .amount {
            color: #ff3b30;
            font-weight: bold;
        }
        .notification-item .message {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f7;
            border-radius: 6px;
        }
        .notification-item .date {
            color: #888;
            font-size: 12px;
        }
        .send-reminder-btn {
            background: #34c759;
            padding: 8px 16px;
            font-size: 14px;
        }
        .send-reminder-btn:hover {
            background: #30b350;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Умные напоминания о долгах</h1>
            <div class="user-actions">
                <a href="/" class="chat-btn">← На главную</a>
                <a href="/chat" class="chat-btn">💬 Чат с AI</a>
                <a href="/ai-analytics" class="analytics-btn">📊 AI-аналитика</a>
                <a href="/reminders" class="reminders-btn"> Напоминания</a>
                <a href="{{ url_for('logout') }}" class="logout-btn">Выйти</a>
            </div>
        </div>

        <div class="group-selector">
            <label>Группа:</label>
            <select id="groupSelect" onchange="loadDebts()">
                <option value="personal">Личные расходы</option>
                {% for g in groups %}
                    <option value="{{ g.id }}" {% if current_group_id == g.id|string %}selected{% endif %}>{{ g.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="debtsSection">
            <h3> Долги в группе</h3>
            <div id="debtsList">
                <p style="color:#888;text-align:center;padding:20px">Загрузка...</p>
            </div>
        </div>

        <hr style="margin:30px 0">

        <div>
            <h3>📬 Мои уведомления 
                <span id="unreadBadge" style="display:none" class="notification-badge">0</span>
            </h3>
            <button onclick="markAllRead()" style="background:#888;padding:8px 16px;font-size:14px">
                Отметить все как прочитанные
            </button>
            <div id="notificationsList" style="margin-top:20px">
                <p style="color:#888;text-align:center;padding:20px">Загрузка...</p>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = {{ user.id }};

        async function loadDebts() {
            const group = document.getElementById('groupSelect').value;
            if (group === 'personal') {
                document.getElementById('debtsList').innerHTML = 
                    '<p style="color:#888;text-align:center;padding:20px">Выберите группу для просмотра долгов</p>';
                return;
            }

            const res = await fetch(`/api/debts?group=${group}`);
            const debts = await res.json();

            if (debts.length === 0) {
                document.getElementById('debtsList').innerHTML = 
                    '<p style="color:#888;text-align:center;padding:20px">Долгов нет</p>';
                return;
            }

            let html = '<table><tr><th>Должник</th><th>Кредитор</th><th>Сумма</th><th>Описание</th><th>Действие</th></tr>';
            
            for (const debt of debts) {
                const reminderRes = await fetch('/api/ai/reminders', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({debts: [debt]})
                });
                const reminderData = await reminderRes.json();
                const reminderText = reminderData.reminders[0]?.reminder || 'Напоминание';

                html += `
                    <tr>
                        <td>${debt.debtor_name}</td>
                        <td>${debt.creditor_name}</td>
                        <td>${debt.amount} ₽</td>
                        <td>${debt.description}</td>
                        <td>
                            <button class="send-reminder-btn" onclick="sendReminder(${debt.id}, ${debt.debtor_id}, ${debt.creditor_id}, ${debt.amount}, '${debt.description.replace(/'/g, "\\'")}')">
                                🔔 Отправить напоминание
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5" style="background:#f9f9f9;padding:10px;font-style:italic;color:#666">
                            "${reminderText}"
                        </td>
                    </tr>
                `;
            }
            html += '</table>';
            document.getElementById('debtsList').innerHTML = html;
        }

        async function sendReminder(debtId, debtorId, creditorId, amount, description) {
            try {
                const res = await fetch('/api/remind', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        debtor_id: debtorId,
                        creditor_id: creditorId,
                        amount: amount,
                        description: description
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    alert('✅ Напоминание отправлено!');
                    loadNotifications();
                } else {
                    alert('❌ Ошибка: ' + data.error);
                }
            } catch (err) {
                alert(' Ошибка: ' + err.message);
            }
        }

        async function loadNotifications() {
            const res = await fetch('/api/notifications');
            const notifications = await res.json();

            // Загружаем количество непрочитанных
            const unreadRes = await fetch('/api/notifications/unread-count');
            const unreadData = await unreadRes.json();
            
            if (unreadData.count > 0) {
                document.getElementById('unreadBadge').style.display = 'inline';
                document.getElementById('unreadBadge').textContent = unreadData.count;
            } else {
                document.getElementById('unreadBadge').style.display = 'none';
            }

            if (notifications.length === 0) {
                document.getElementById('notificationsList').innerHTML = 
                    '<p style="color:#888;text-align:center;padding:20px">Уведомлений нет</p>';
                return;
            }

            let html = '';
            for (const notif of notifications) {
                const unreadClass = notif.is_read === 0 ? 'unread' : '';
                html += `
                    <div class="notification-item ${unreadClass}" onclick="markAsRead(${notif.id})">
                        <div class="header">
                            <span class="from">От: ${notif.from_user_name || 'Неизвестно'}</span>
                            <span class="amount">${notif.amount} ₽</span>
                        </div>
                        <div class="message">${notif.message}</div>
                        <div class="date">${new Date(notif.created_at).toLocaleString('ru-RU')}</div>
                    </div>
                `;
            }
            document.getElementById('notificationsList').innerHTML = html;
        }

        async function markAsRead(notificationId) {
            await fetch(`/api/notifications/${notificationId}/read`, {method: 'POST'});
            loadNotifications();
        }

        async function markAllRead() {
            await fetch('/api/notifications/read-all', {method: 'POST'});
            loadNotifications();
        }

        // Загружаем данные при загрузке страницы
        window.onload = () => {
            loadDebts();
            loadNotifications();
            // Обновляем уведомления каждые 30 секунд
            setInterval(loadNotifications, 30000);
        };
    </script>
</body>
</html>
