<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Чат — Новые Лица</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .chat-page-layout { max-width: 900px; margin: 0 auto; padding: 100px 20px 20px; height: calc(100vh - 100px); display: flex; flex-direction: column; }
        .chat-main-container { flex: 1; background: linear-gradient(135deg, rgba(139, 92, 246, 0.04), rgba(6, 182, 212, 0.04)); border: 1px solid var(--border); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header-bar { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .chat-header-bar h1 { font-size: 20px; font-weight: 700; margin: 0; }
        .chat-status { display: flex; align-items: center; gap: 8px; color: var(--success); font-size: 0.9rem; }
        .chat-status span { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 10px var(--success); }
        .chat-messages-area { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .chat-input-wrapper { padding: 1.5rem; background: rgba(5, 5, 5, 0.7); border-top: 1px solid var(--border); display: flex; gap: 1rem; }
        .chat-input-wrapper input { flex: 1; padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; }
        .chat-input-wrapper input:focus { border-color: var(--primary); }
        .chat-input-wrapper button { padding: 0.75rem 1.5rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="nav-header">
        <div class="nav-container">
            <div class="logo">Новые Лица</div>
            <div class="nav-links">
                <a href="/" class="nav-btn"> Главная</a>
                <a href="/ai-analytics" class="nav-btn">📈 Аналитика</a>
                <a href="{{ url_for('logout') }}" class="nav-btn logout">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="chat-page-layout">
        <div class="chat-main-container">
            <div class="chat-header-bar">
                <h1>🤖 Финансовый помощник</h1>
                <div class="chat-status"><span></span> Online</div>
            </div>
            <div class="chat-messages-area" id="chatMessages">
                <div class="chat-message agent-message">Привет! Я AI-помощник. Спрашивай о финансах, бюджете, экономии — помогу разобраться!</div>
            </div>
            <form class="chat-input-wrapper" id="chatForm">
                <input type="text" id="chatInput" placeholder="Задайте вопрос..." autocomplete="off" required>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            const body = document.getElementById('chatMessages');
            const userMsg = document.createElement('div');
            userMsg.className = 'chat-message user-message';
            userMsg.textContent = text;
            body.appendChild(userMsg);
            input.value = '';
            body.scrollTop = body.scrollHeight;
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'chat-message agent-message';
            loadingMsg.textContent = '⏳ Печатает...';
            body.appendChild(loadingMsg);
            try {
                const res = await fetch('/api/ai/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: text})
                });
                const data = await res.json();
                loadingMsg.remove();
                const aiMsg = document.createElement('div');
                aiMsg.className = 'chat-message agent-message';
                aiMsg.textContent = data.success ? data.answer : '❌ Ошибка: ' + data.error;
                body.appendChild(aiMsg);
            } catch {
                loadingMsg.remove();
                const errorMsg = document.createElement('div');
                errorMsg.className = 'chat-message agent-message';
                errorMsg.textContent = '❌ Ошибка соединения';
                body.appendChild(errorMsg);
            }
            body.scrollTop = body.scrollHeight;
        });
    </script>
</body>
</html>
