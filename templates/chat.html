<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с AI-ассистентом</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .chat-container {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 80%;
        }
        .message.user {
            background: #0071e3;
            color: white;
            margin-left: auto;
        }
        .message.ai {
            background: #f5f5f7;
            color: #1d1d1f;
        }
        .message-header {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Чат с AI-ассистентом</h1>
            <div class="user-actions">
                <a href="/" class="chat-btn">← На главную</a>
                <a href="/chat" class="chat-btn">💬 Чат с AI</a>
                <a href="/ai-analytics" class="analytics-btn">📊 AI-аналитика</a>
                <a href="/reminders" class="reminders-btn"> Напоминания</a>
                <a href="{{ url_for('logout') }}" class="logout-btn">Выйти</a>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message ai">
                <div class="message-header">🤖 AI-ассистент</div>
                <div>Привет! Я AI-ассистент. Спрашивай о финансах, бюджете, экономии — помогу разобраться!</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="questionInput" placeholder="Задайте вопрос..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            // Добавляем сообщение пользователя
            addMessage(question, 'user');
            input.value = '';

            // Показываем индикатор загрузки
            const loadingId = addMessage('⏳ Думаю...', 'ai', true);

            try {
                const res = await fetch('/api/ai/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: question})
                });
                
                const data = await res.json();
                
                // Удаляем индикатор загрузки
                removeMessage(loadingId);
                
                if (data.success) {
                    addMessage(data.answer, 'ai');
                } else {
                    addMessage('❌ Ошибка: ' + data.error, 'ai');
                }
            } catch (err) {
                removeMessage(loadingId);
                addMessage('❌ Ошибка соединения: ' + err.message, 'ai');
            }
        }

        function addMessage(text, sender, isLoading = false) {
            const container = document.getElementById('chatContainer');
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.id = id;
            div.innerHTML = `
                <div class="message-header">${sender === 'user' ? '👤 Вы' : '🤖 AI-ассистент'}</div>
                <div>${text}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const msg = document.getElementById(id);
            if (msg) msg.remove();
        }
    </script>
</body>
</html>
