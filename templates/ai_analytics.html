<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-аналитика</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 AI-аналитика расходов группы</h1>
            <div class="user-actions">
                <a href="/" class="chat-btn">← На главную</a>
                <a href="/chat" class="chat-btn"> Чат с AI</a>
                <a href="/ai-analytics" class="analytics-btn"> AI-аналитика</a>
                <a href="/reminders" class="reminders-btn">💰 Напоминания</a>
                <a href="{{ url_for('logout') }}" class="logout-btn">Выйти</a>
            </div>
        </div>

        <div class="group-selector">
            <label>Выберите группу для анализа:</label>
            <select id="groupSelect" onchange="loadExpenses()">
                <option value="personal">Личные расходы</option>
                {% for g in groups %}
                    <option value="{{ g.id }}">{{ g.name }}</option>
                {% endfor %}
            </select>
        </div>

        <button onclick="analyzeExpenses()" id="analyzeBtn" style="padding:15px 30px;font-size:16px">
             Получить AI-анализ
        </button>

        <div id="loading" style="display:none;text-align:center;padding:40px">
            <p>⏳ AI анализирует расходы...</p>
            <p style="color:#888;font-size:14px">Это может занять до 30 секунд</p>
        </div>

        <div id="result" style="display:none">
            <div class="stats">
                <h3> Общая статистика</h3>
                <p><strong>Общие расходы:</strong> <span id="totalAmount">0</span> ₽</p>
                <p><strong>На человека:</strong> <span id="perPerson">0</span> ₽</p>
                <p><strong>Возможная экономия:</strong> <span id="savings">0</span> ₽</p>
            </div>

            <div class="stats">
                <h3>🏷️ Топ категорий</h3>
                <table id="categoriesTable">
                    <tr><th>Категория</th><th>Сумма</th></tr>
                </table>
            </div>

            <div class="stats">
                <h3>💡 Рекомендации AI</h3>
                <ul id="adviceList"></ul>
            </div>
        </div>

        <div id="error" style="display:none;color:#ff3b30;text-align:center;padding:20px"></div>
    </div>

    <script>
        async function loadExpenses() {
            const group = document.getElementById('groupSelect').value;
            const res = await fetch(`/api/expenses?group=${group}`);
            window.expensesData = await res.json();
        }

        async function analyzeExpenses() {
            if (!window.expensesData || window.expensesData.length === 0) {
                alert('Нет расходов для анализа. Выберите другую группу или добавьте расходы.');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('analyzeBtn').disabled = true;

            try {
                const res = await fetch('/api/ai/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({expenses: window.expensesData})
                });
                
                const data = await res.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                // Отображаем результаты
                document.getElementById('totalAmount').textContent = data.total || 0;
                document.getElementById('perPerson').textContent = data.per_person || 0;
                document.getElementById('savings').textContent = data.potential_savings || 0;

                // Категории
                const catTable = document.getElementById('categoriesTable');
                catTable.innerHTML = '<tr><th>Категория</th><th>Сумма</th></tr>';
                if (data.top_categories && data.top_categories.length > 0) {
                    data.top_categories.forEach(cat => {
                        catTable.innerHTML += `<tr><td>${cat.category}</td><td>${cat.total} ₽</td></tr>`;
                    });
                } else {
                    catTable.innerHTML += '<tr><td colspan="2">Нет данных</td></tr>';
                }

                // Советы
                const adviceList = document.getElementById('adviceList');
                adviceList.innerHTML = '';
                if (data.advice && data.advice.length > 0) {
                    data.advice.forEach(advice => {
                        adviceList.innerHTML += `<li>${advice}</li>`;
                    });
                } else {
                    adviceList.innerHTML = '<li>Нет рекомендаций</li>';
                }

                document.getElementById('result').style.display = 'block';
            } catch (err) {
                document.getElementById('error').textContent = 'Ошибка: ' + err.message;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        // Загружаем расходы при загрузке страницы
        window.onload = loadExpenses;
    </script>
</body>
</html>
