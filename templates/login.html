<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Новые Лица</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-screen">
        <div class="auth-container">
            <div class="auth-logo">Новые Лица</div>
            <div class="auth-subtitle">Учёт расходов</div>
            <h1 class="auth-title">С возвращением</h1>
            <p class="auth-description">Войди, чтобы продолжить работу с бюджетом</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form class="auth-form" action="{{ url_for('login') }}" method="POST">
                <div class="form-field">
                    <label>Никнейм</label>
                    <input type="text" name="nickname" placeholder="Введите никнейм" required>
                </div>
                <div class="form-field">
                    <label>Пароль</label>
                    <input type="password" name="password" placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="auth-submit">Войти в кабинет →</button>
            </form>

            <div class="auth-switch">
                Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</body>
</html>
